server:
  address: 127.0.0.1
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/campus_canteen?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:123456}
  sql:
    init:
      mode: always
      encoding: UTF-8
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jackson:
    deserialization:
      accept-float-as-int: false
    time-zone: Asia/Shanghai
app:
  upload-dir: ${UPLOAD_DIR:./uploads}
  admin-username: ${ADMIN_USERNAME:admin}
  admin-password: ${ADMIN_PASSWORD:}
